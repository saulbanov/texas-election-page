<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview card</title>
<!-- Template for the 1200x630 link-preview image. tools/update.py fills the {{...}} fields, writes og/card.html and renders it with og/render.sh. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=League+Gothic&family=Unbounded:wght@600&display=swap">
<style>
:root { --page: #f0e8d4; --paper: #FAF8F2; --ink: #1A1208; --muted: #625D52; --rule: #D0C4AE; --gold: #C9901A; --gold-wash: #F5EBCB;
  --dem: #355C93; --rep: #A0382E; --fh-red: #C44B22;
  --display: 'League Gothic', 'Arial Narrow', Impact, sans-serif; --mono: 'IBM Plex Mono', Menlo, monospace; --logo: 'Unbounded', Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--page); color: var(--ink); }
.card { width: 1200px; height: 630px; padding: 44px 60px 0; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--ink); padding-bottom: 12px; }
.stamp { font: 600 15px/1 var(--logo); letter-spacing: 0.08em; text-transform: uppercase; display: inline-flex; gap: 10px; align-items: center; }
.stamp::before { content: ""; width: 14px; height: 14px; background: var(--fh-red); }
.live { font: 600 16px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fh-red); display: inline-flex; gap: 10px; align-items: center; }
.live::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--fh-red); }
h1 { margin: 0; font: 400 74px/0.95 var(--display); letter-spacing: 0.01em; }
.main { display: grid; grid-template-columns: auto 1fr; gap: 36px; align-items: center; }
.read { display: grid; gap: 6px; border-left: 6px solid var(--gold); padding-left: 22px; }
.read .k { font: 600 15px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.read .v { white-space: nowrap; font: 400 150px/0.9 var(--display); letter-spacing: 0.01em; }
.read .c { font: 22px/1.2 var(--mono); }
.races { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; font: 23px/1.2 var(--mono); }
.races li { white-space: nowrap; }
.races li { display: flex; justify-content: space-between; gap: 18px; border-top: 1px solid var(--rule); padding-top: 9px; }
.races b { font-weight: 600; }
.foot { margin: 0 -60px; padding: 16px 60px 20px; background: var(--gold-wash); border-top: 5px solid var(--gold);
  display: flex; justify-content: space-between; align-items: baseline; font: 18px/1.2 var(--mono); }
.foot b { font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="stamp">Future Heist</span><span class="live">Live &middot; data through {{THRU}}</span></div>
  <div class="main">
    <div class="read"><span class="k">Our central read &middot; U.S. Senate</span><span class="v" style="color:{{SENATE_COLOR}}">{{SENATE}}</span><span class="c">{{CHANCE}}</span></div>
    <ul class="races">{{RACES}}</ul>
  </div>
  <div class="foot"><span>Scenarios run from <b>{{RANGE}}</b></span><span>A rough model, not a forecast</span></div>
</div>
</body>
</html>
